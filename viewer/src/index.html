<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>Model Viewer</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div id="ui-panel">
      <label>
        Open GLTF/GLB file
        <input id="fileInput" type="file" accept=".gltf,.glb" />
      </label>
      <div id="errorMessage" role="alert"></div>
      <div id="loadingIndicator" aria-live="polite"></div>
    </div>
    <div id="viewer-container"></div>
  </body>
</html>
