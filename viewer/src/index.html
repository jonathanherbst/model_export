<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>Model Viewer</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div id="ui-panel">
      <label>
        Open GLTF/GLB file
        <input id="fileInput" type="file" accept=".gltf,.glb" />
      </label>
      <button id="materialsButton" type="button" disabled>Show Materials</button>
      <div id="errorMessage" role="alert"></div>
      <div id="loadingIndicator" aria-live="polite"></div>
    </div>
    <div id="viewer-container"></div>
    <div id="animation-bar" hidden>
      <select id="animationSelect"></select>
      <button id="playPauseBtn" type="button" title="Play/Pause">⏸</button>
      <input type="range" id="timelineSlider" min="0" max="0" value="0" step="0.01">
      <span id="timeDisplay">0:00 / 0:00</span>
    </div>
  </body>
</html>
